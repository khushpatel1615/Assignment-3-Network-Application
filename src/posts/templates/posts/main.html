{%extends 'base.html'%}
{% load static %}

{%block scripts %}
<script src="{% static 'posts/main.js' %}" defer></script>
{%endblock scripts %}

{%block title%}
posts
{%endblock title %}
{%block content %}
<!-- {% for obj in qs %}
    <p>{{ obj.title }} - {{obj.body}}</p>
{% endfor %} -->


<!-- Modal -->
<div class="modal fade" id="addPostModel" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Create post</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        ...
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-success">+ add</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Button trigger modal -->
<button type="button" class="btn btn-info mb-2" data-bs-toggle="modal" data-bs-target="#addPostModel">
  add post
</button>

<!-- <div id = "spinner-box"> -->
    <div class="text-center mt-3" id="spinner-box">
    <div class="spinner-border" role="status"></div>
</div>
<div id ="posts-box" ></div>
<div class ="text-center mb-3" id="end-box">
    <button class="btn btn-primary" id="load-btn">Load more</button>
</div>
{% endblock content %}
